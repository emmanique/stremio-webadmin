name: Functional Regression

on:
  push:
    branches: [development, "integration/**", "fix/**", "feature/**"]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      group:
        description: Functional group or all
        required: false
        default: all
        type: choice
        options:
          - all
          - core-torrent
          - playback-streaming
          - transcoding
          - subtitles
          - library
          - vpn-network
          - webadmin-config
          - version-update
          - packaging-install

permissions:
  contents: read

jobs:
  matrix-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate functional ownership
        run: python3 tools/ci/functional-regression.py --validate

  regression:
    needs: matrix-contract
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Run cumulative functional regression
        shell: bash
        run: |
          requested="${{ inputs.group || 'all' }}"
          if [ "$requested" = "all" ]; then
            bash tools/ci/functional-regression.sh all
          else
            bash tools/ci/functional-regression.sh "$requested"
            echo "Feature-specific result passed; running all previous/current functional contracts."
            bash tools/ci/functional-regression.sh all
          fi
