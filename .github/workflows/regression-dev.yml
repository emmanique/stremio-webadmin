name: DEV Full Regression

on:
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: astral-sh/setup-uv@v4
      - name: Install regression dependencies
        run: |
          uv lock --check
          uv sync --frozen --dev
          uv pip install -r webadmin/requirements.txt
          uv pip check
      - name: Full regression
        run: bash tools/ci/full-regression.sh
