# Stremio workload resolver.
#
# The Stremio container shares Gluetun's network namespace but keeps its
# own mount namespace.  Resolve through Pi-hole directly so application,
# libtorrent and child processes cannot bypass DNS filtering when the
# VPN owns 127.0.0.1:53.
#
# Pi-hole forwards upstream queries to the private Gluetun DNS proxy
# at 172.30.0.10:1053.
nameserver 172.30.0.53
options ndots:0
