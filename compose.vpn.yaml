name: stremio-platform

# Full CyberGhost VPN mode. Only the Stremio runtime shares Gluetun's network
# namespace; WebAdmin and Pi-hole remain directly reachable from the LAN.
# Connection profiles are created/imported in WebAdmin -> VPN and stored in the
# private vpn-data volume. Start with: sh start-vpn.sh
services:
  gluetun:
    image: "${VPN_IMAGE:-ghcr.io/emmanique/stremio-libtorrent-server-webadmin-vpn:latest}"
    pull_policy: always
    container_name: stremio-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: "${TZ:-Africa/Luanda}"
      # vpn/entrypoint.sh selects the active/startup profile and exports
      # OPENVPN_CUSTOM_CONFIG + write-only credentials before Gluetun starts.
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      FIREWALL: "on"
      # These are LAN/control ports only. BitTorrent port 6881 is deliberately
      # not published on the host in VPN mode because CyberGhost has no VPN-side
      # port forwarding and exposing the host WAN port would bypass VPN privacy.
      FIREWALL_INPUT_PORTS: "8000,8080,11470,12470"
      FIREWALL_OUTBOUND_SUBNETS: "${VPN_LAN_CIDRS:-192.168.0.0/16,10.0.0.0/8,172.30.0.0/24}"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: "{\"auth\":\"apikey\",\"apikey\":\"${VPN_CONTROL_API_KEY:?Run sh start-vpn.sh or export VPN_CONTROL_API_KEY}\"}"
    ports:
      - "${IPADDRESS:-0.0.0.0}:8080:8080"
      - "${IPADDRESS:-0.0.0.0}:11470:11470"
      - "${IPADDRESS:-0.0.0.0}:12470:12470"
    volumes:
      # Writable only so the wrapper can consume the one-shot next_profile file
      # and record the profile that actually started. WebAdmin owns profile CRUD.
      - vpn-data:/vpn
      - gluetun-data:/gluetun
    networks:
      stremio-internal:
        ipv4_address: 172.30.0.10

  stremio-libtorrent-server:
    image: "${STREMIO_IMAGE:-ghcr.io/emmanique/stremio-libtorrent-server-webadmin:latest}"
    pull_policy: always
    container_name: stremio-libtorrent-server
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
      pihole:
        condition: service_started
    environment:
      STREMIOSRV_BT_LISTEN_PORT: "${STREMIOSRV_BT_LISTEN_PORT:-6881}"
      STREMIOSRV_CACHE_ROOT: /root/.stremio-server
      STREMIOSRV_EXTERNAL_CONFIG: /config/admin-settings.json
      CERT_FILE: "${CERT_FILE:-certificates.pem}"
      STREMIOSRV_CERT_FILE: "${CERT_FILE:-certificates.pem}"
      IPADDRESS: "${IPADDRESS:-}"
      SERVER_URL: "${SERVER_URL:-}"
      STREMIOSRV_LIBRARY_UI: "${STREMIOSRV_LIBRARY_UI:-true}"
      STREMIOSRV_LIBRARY_ALLOW_HTTP: "${STREMIOSRV_LIBRARY_ALLOW_HTTP:-false}"
      STREMIOSRV_LIBRARY_OWNER: "${STREMIOSRV_LIBRARY_OWNER:-}"
      STREMIOSRV_LIBRARY_ADDON_ALLOW: "${STREMIOSRV_LIBRARY_ADDON_ALLOW:-}"
      TRANSCODING_MODE: "${TRANSCODING_MODE:-auto}"
      TRANSCODING_HWACCEL: "${TRANSCODING_HWACCEL:-vaapi}"
      VAAPI_DEVICE: "${VAAPI_DEVICE:-/dev/dri/renderD128}"
      TRANSCODING_VIDEO_CODEC: "${TRANSCODING_VIDEO_CODEC:-h264_vaapi}"
      TRANSCODING_VIDEO_QUALITY: "${TRANSCODING_VIDEO_QUALITY:-22}"
      TRANSCODING_AUDIO_CODEC: "${TRANSCODING_AUDIO_CODEC:-aac}"
      TRANSCODING_AUDIO_BITRATE: "${TRANSCODING_AUDIO_BITRATE:-192k}"
      TRANSCODING_COPY_VIDEO: "${TRANSCODING_COPY_VIDEO:-true}"
      TRANSCODING_COPY_AUDIO: "${TRANSCODING_COPY_AUDIO:-true}"
      TRANSCODING_DIRECT_VIDEO_CODECS: "${TRANSCODING_DIRECT_VIDEO_CODECS:-h264}"
      TRANSCODING_DIRECT_AUDIO_CODECS: "${TRANSCODING_DIRECT_AUDIO_CODECS:-aac,mp3,ac3}"
      TRANSCODING_FALLBACK_CODEC: "${TRANSCODING_FALLBACK_CODEC:-libx264}"
      TRANSCODING_HW_DECODE: "${TRANSCODING_HW_DECODE:-true}"
    volumes:
      - ${STREMIO_DATA_DIR:-stremio-cache}:/root/.stremio-server
      - stremio-config:/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11470/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  webadmin:
    image: "${WEBADMIN_IMAGE:-ghcr.io/emmanique/stremio-libtorrent-server-webadmin-webadmin:latest}"
    pull_policy: always
    container_name: stremio-webadmin
    restart: unless-stopped
    environment:
      WEBADMIN_STATE: /data
      STREMIO_CONFIG_FILE: /config/admin-settings.json
      STREMIO_URL: http://gluetun:11470
      STREMIO_CONTAINER: stremio-libtorrent-server
      STREMIO_IMAGE: "${STREMIO_IMAGE:-ghcr.io/emmanique/stremio-libtorrent-server-webadmin:latest}"
      STREMIO_PACKAGE_REPO: "${STREMIO_PACKAGE_REPO:-ghcr.io/emmanique/stremio-libtorrent-server-webadmin}"
      WEBADMIN_IMAGE: "${WEBADMIN_IMAGE:-ghcr.io/emmanique/stremio-libtorrent-server-webadmin-webadmin:latest}"
      STREMIO_SOURCE_REPO: "${STREMIO_SOURCE_REPO:-https://github.com/emmanique/stremio-libtorrent-server-webadmin}"
      STREMIO_SOURCE_BRANCH: "${STREMIO_SOURCE_BRANCH:-main}"
      STREMIO_UPDATE_HEALTH_TIMEOUT: "${STREMIO_UPDATE_HEALTH_TIMEOUT:-180}"
      VPN_CONFIG_DIR: /vpn
      VPN_CONTAINER: stremio-gluetun
      VPN_CONTROL_URL: http://gluetun:8000
      VPN_CONTROL_API_KEY: "${VPN_CONTROL_API_KEY}"
      IPADDRESS: "${IPADDRESS:-localhost}"
      WEB_PLAYER_URL: "http://${IPADDRESS:-localhost}:8080"
      SERVER_URL: "http://${IPADDRESS:-localhost}:11470"
    ports:
      - "${IPADDRESS:-0.0.0.0}:8090:8090"
    volumes:
      - webadmin-data:/data
      - stremio-config:/config
      - vpn-data:/vpn
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - stremio-internal
    depends_on:
      pihole:
        condition: service_started

  pihole:
    image: pihole/pihole:latest
    pull_policy: always
    container_name: stremio-pihole
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Africa/Luanda}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:-}"
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: "${PIHOLE_UPSTREAM_DNS:-1.1.1.1;1.0.0.1}"
    expose:
      - "53/tcp"
      - "53/udp"
    ports:
      - "${PIHOLE_WEB_BIND_IP:-0.0.0.0}:${PIHOLE_WEB_PORT:-8053}:80/tcp"
    volumes:
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
    networks:
      stremio-internal:
        ipv4_address: 172.30.0.53

networks:
  stremio-internal:
    name: stremio-internal
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  stremio-cache:
  stremio-config:
  webadmin-data:
  pihole-etc:
  pihole-dnsmasq:
  vpn-data:
  gluetun-data:
