name: DEV CI

on:
  push:
    branches: [development, "integration/**", "fix/**", "feature/**"]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --frozen --dev
          uv pip install -r webadmin/requirements.txt
      - name: Repository and static gates
        run: |
          bash tools/ci/repo-guard.sh
          bash tools/ci/static-check.sh
          bash tools/ci/compose-check.sh
      - name: Deterministic regression
        run: bash tools/ci/run-tests.sh deterministic
