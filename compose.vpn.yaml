# VPN mode for the streaming runtime from THIS fork.
#
# Only the streaming runtime shares gluetun's network namespace, so its internet/BitTorrent traffic
# follows the VPN kill-switch. This file is runtime-only; use compose.yaml for the normal full
# WebAdmin + Pi-hole stack.
#
# Example:
#   WIREGUARD_PRIVATE_KEY=... WIREGUARD_ADDRESSES=10.2.0.2/32 \
#   IPADDRESS=<server-LAN-IP> docker compose -f compose.vpn.yaml up -d
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    pull_policy: always
    container_name: stremio-gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      VPN_SERVICE_PROVIDER: "${VPN_SERVICE_PROVIDER:-protonvpn}"
      VPN_TYPE: "${VPN_TYPE:-wireguard}"
      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY}"
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES}"
      VPN_PORT_FORWARDING: "${VPN_PORT_FORWARDING:-on}"
      FIREWALL_OUTBOUND_SUBNETS: "${FIREWALL_OUTBOUND_SUBNETS:-192.168.0.0/16,10.0.0.0/8}"
    ports:
      - "${IPADDRESS:-0.0.0.0}:8080:8080"
      - "${IPADDRESS:-0.0.0.0}:11470:11470"
      - "${IPADDRESS:-0.0.0.0}:12470:12470"
      - "127.0.0.1:8000:8000"

  stremio-libtorrent-server:
    image: "${STREMIO_IMAGE:-ghcr.io/emmanique/stremio-libtorrent-server-webadmin:latest}"
    pull_policy: always
    container_name: stremio-libtorrent-server
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      IPADDRESS: "${IPADDRESS:-}"
      SERVER_URL: "${SERVER_URL:-}"
      STREMIOSRV_BT_LISTEN_PORT: "${STREMIOSRV_BT_LISTEN_PORT:-6881}"
      STREMIOSRV_CACHE_ROOT: /root/.stremio-server
      CERT_FILE: "${CERT_FILE:-certificates.pem}"
      STREMIOSRV_LIBRARY_UI: "${STREMIOSRV_LIBRARY_UI:-true}"
      STREMIOSRV_LIBRARY_ALLOW_HTTP: "${STREMIOSRV_LIBRARY_ALLOW_HTTP:-false}"
      STREMIOSRV_LIBRARY_OWNER: "${STREMIOSRV_LIBRARY_OWNER:-}"
      STREMIOSRV_LIBRARY_ADDON_ALLOW: "${STREMIOSRV_LIBRARY_ADDON_ALLOW:-}"
    volumes:
      - ${STREMIO_DATA_DIR:-stremio-cache}:/root/.stremio-server
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11470/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  stremio-cache:
